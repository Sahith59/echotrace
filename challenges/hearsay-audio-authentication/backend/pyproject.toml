[project]
name = "echotrace"
version = "0.1.0"
description = "Local audio-forensics workbench for HEARSAY"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.20",
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "soundfile>=0.12,<1",
  "torch>=2.6,<3",
  "scikit-learn>=1.5,<2",
  "python-dotenv>=1,<2",
  "transformers>=4.48,<5",
  "huggingface-hub>=0.28,<1",
  "safetensors>=0.5,<1",
  "faster-whisper>=1.2,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
echotrace = "echotrace.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
